<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - SoloBiz</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <script src="/static/tailwind.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="auth-page min-h-screen flex items-center justify-center p-4">

  <div class="auth-card w-full max-w-md rounded-2xl p-8 text-center">

      <span class="text-2xl font-black tracking-widest">404</span>
    </div>

    <!-- Error Title -->
    <h1 class="text-2xl font-bold text-slate-900">Page not found</h1>
    <p class="text-xs text-slate-400 mt-2 leading-relaxed">
      This page isn’t available. Check the address or return to your dashboard.
    </p>

    <!-- Action Buttons -->
    <div class="mt-8 flex justify-center">
      <a href="/" 
         class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200 text-xs flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

  </div>

</body>
