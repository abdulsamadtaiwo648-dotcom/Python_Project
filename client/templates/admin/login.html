<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in · SoloBiz</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 400px); padding: 36px; border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; box-shadow: 0 12px 32px rgba(15, 23, 42, .06); }
    .brand { margin: 0 0 30px; font-size: 15px; font-weight: 700; letter-spacing: .02em; color: #263b86; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.035em; }
    .intro { margin: 8px 0 26px; color: #687386; font-size: 14px; }
    label { display: block; margin: 18px 0 7px; font-size: 13px; font-weight: 600; }
    input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #d5dbe5; border-radius: 8px; font: inherit; font-size: 14px; }
    input:focus { outline: 3px solid #2f5bff22; border-color: #2f5bff; }
    button { width: 100%; height: 44px; margin-top: 24px; border: 0; border-radius: 8px; background: #243c8f; color: white; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; }
    button:hover { background: #1c3076; }
    .error { margin: 0 0 15px; color: #b42318; font-size: 13px; }
    @media (max-width: 480px) { main { padding: 28px 23px; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">SoloBiz <span aria-hidden="true">/</span> Administration</p>
    <h1>Sign in</h1>
    <p class="intro">Use your administrator account to continue.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<p class="error" role="alert">{{ message }}</p>{% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
