<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense | SoloBiz</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <script src="/static/tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col">

    <header class="bg-gray-900 text-white p-4 shadow-md">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <a href="/" class="text-gray-400 hover:text-white transition">← Back</a>
            <h1 class="font-bold text-lg">Edit Expense</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full mt-8 px-4 flex-grow">
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <form method="POST" action="/edit/{{ index }}" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Amount (₦)</label>
                    <input type="number" name="amount" value="{{ item.amount }}" required 
                        class="w-full border border-gray-200 rounded-lg p-3 text-gray-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Category</label>
                    <input type="text" name="category" value="{{ item.category }}" required 
                        class="w-full border border-gray-200 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Description</label>
                    <input type="text" name="description" value="{{ item.description }}" required 
                        class="w-full border border-gray-200 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                
                <div class="pt-4 flex gap-3">
                    <button type="submit" class="flex-grow bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">
                        Update Output
                    </button>
                    <a href="/" class="w-1/3 text-center bg-gray-100 text-gray-600 font-bold py-3 rounded-lg hover:bg-gray-200 transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </main>
</body>
</html>
