<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SoloBiz</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Clerk Browser CDN -->
    <script 
        async 
        crossorigin="anonymous" 
        data-clerk-publishable-key="{{ clerk_publishable_key or 'pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA' }}" 
        src="https://cdn.clerk.com/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
    </script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="flex flex-col items-center w-full max-w-md">
        <div class="flex items-center gap-3 mb-6">
            <img src="/static/logo.svg" alt="SoloBiz Logo" class="w-12 h-12 rounded-xl shadow-lg border border-indigo-500/20">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">SoloBiz</h1>
                <p class="text-xs text-indigo-400 font-medium">Pocket CFO for Entrepreneurs</p>
            </div>
        </div>

        <div id="clerk-app" class="w-full flex justify-center">
            <div id="clerk-loading" class="text-center py-10">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="text-xs text-gray-400 mt-3 font-medium">Loading secure sign in...</p>
            </div>
        </div>
    </div>

    <script>
        const PUBLISHABLE_KEY = "{{ clerk_publishable_key or 'pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA' }}";

        window.addEventListener("load", async () => {
            let attempts = 0;
            while (!window.Clerk && attempts < 50) {
                await new Promise(r => setTimeout(r, 100));
                attempts++;
            }

            if (!window.Clerk) {
                const loadingEl = document.getElementById("clerk-loading");
                if (loadingEl) {
                    loadingEl.innerHTML = `
                        <div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-xs text-center">
                            <p class="font-bold">CDN Connection Failed</p>
                            <p class="mt-1 text-gray-300">Could not download Clerk JS SDK. Please check your network connection.</p>
                        </div>
                    `;
                }
                return;
            }

            try {
                await window.Clerk.load({
                    publishableKey: PUBLISHABLE_KEY
                });

                if (window.Clerk.user) {
                    window.location.href = "/";
                } else {
                    const loadingEl = document.getElementById("clerk-loading");
                    if (loadingEl) loadingEl.style.display = "none";
                    window.Clerk.mountSignIn(document.getElementById("clerk-app"));
                }
            } catch (err) {
                console.error("Clerk loading error:", err);
                const loadingEl = document.getElementById("clerk-loading");
                if (loadingEl) {
                    loadingEl.innerHTML = `
                        <div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-xs text-center">
                            <p class="font-bold">Sign-In Error</p>
                            <p class="mt-1 text-gray-300">${err.message || 'Could not load Clerk Sign-In component.'}</p>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
