<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SoloBiz</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">

    <!-- Header -->
    <div class="flex flex-col items-center mb-6 text-center">
      <img src="/static/logo.svg" alt="SoloBiz Logo" class="w-12 h-12 rounded-xl shadow-lg border border-indigo-500/20 mb-3">
      <h1 class="text-2xl font-bold">Welcome Back</h1>
      <p class="text-xs text-slate-400 mt-1">Log in to your SoloBiz account</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg text-xs font-medium text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- 1. Email & Password Form -->
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email Address</label>
        <input type="email" id="login-email" name="email" required placeholder="name@example.com"
               class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm transition">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-300 uppercase">Password</label>
          <button type="button" onclick="handleForgotPassword()" class="text-xs text-indigo-400 hover:underline font-medium cursor-pointer">
            Forgot Password?
          </button>
        </div>
        <input type="password" name="password" required placeholder="••••••••"
               class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm transition">
      </div>

      <button type="submit"
              class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm cursor-pointer">
        Log In with Email
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6 text-center">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
      <span class="relative bg-slate-900 px-3 text-xs text-slate-500 uppercase font-medium">Or continue with</span>
    </div>

    <!-- 2. Clerk Auth Component (auto-mounted) -->
    <div id="clerk-sign-in"></div>

    <p class="mt-6 text-center text-xs text-slate-400">
      Don't have an account? <a href="/register" class="text-indigo-400 font-bold hover:underline">Sign up</a>
    </p>

  </div>

  <!-- Clerk SDK – hardcoded publishable key -->
  <script
    async crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>

  <script>
    const CLERK_PK = "pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA";

    // Auto-mount the Clerk SignIn component when the page loads
    window.addEventListener('load', async function () {
      const container = document.getElementById('clerk-sign-in');
      if (!container) return;

      // Wait up to 5 s for the async Clerk SDK script to arrive
      let attempts = 0;
      while (!window.Clerk && attempts < 50) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }

      if (!window.Clerk) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">Clerk is unavailable. Please use the email form above.</p>';
        return;
      }

      try {
        await window.Clerk.load({ publishableKey: CLERK_PK });

        // If already signed in via Clerk, send straight to dashboard
        if (window.Clerk.user) {
          window.location.href = '/';
          return;
        }

        // Render the full Clerk sign-in component
        window.Clerk.mountSignIn(container);
      } catch (err) {
        console.error('Clerk load error:', err);
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">Could not load Clerk. Please use the email form above.</p>';
      }
    });

    // Forgot Password – Clerk reset_password_email_code flow
    async function handleForgotPassword() {
      const emailInput = document.getElementById('login-email') || document.querySelector('input[name="email"]');
      const email = emailInput ? emailInput.value.trim() : '';
      if (!email) {
        alert('Please enter your email address in the Email field first.');
        return;
      }

      if (!window.Clerk) {
        alert('Clerk SDK is not loaded yet. Please refresh the page and try again.');
        return;
      }

      try {
        await window.Clerk.load({ publishableKey: CLERK_PK });

        await window.Clerk.client.signIn.create({
          strategy: 'reset_password_email_code',
          identifier: email,
        });

        const pin = prompt(`A 6-digit PIN was sent to ${email}.\n\nPlease enter it here:`);
        if (!pin) return;

        const newPassword = prompt('Enter your new password:');
        if (!newPassword) return;

        const result = await window.Clerk.client.signIn.attemptFirstFactor({
          strategy: 'reset_password_email_code',
          code: pin.trim(),
          password: newPassword.trim(),
        });

        if (result.status === 'complete') {
          alert('Password updated successfully! You are now logged in.');
          window.location.href = '/';
        } else {
          alert('Password reset completed with status: ' + result.status);
        }
      } catch (err) {
        const msg = (err.errors && err.errors[0] && err.errors[0].message)
          ? err.errors[0].message
          : (err.message || String(err));
        alert('Error: ' + msg);
      }
    }
  </script>

</body>
</html>
