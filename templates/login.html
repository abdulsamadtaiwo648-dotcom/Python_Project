<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SoloBiz</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="flex flex-col items-center w-full max-w-md">
        <div class="flex items-center gap-3 mb-6">
            <img src="/static/logo.svg" alt="SoloBiz Logo" class="w-12 h-12 rounded-xl shadow-lg border border-indigo-500/20">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">SoloBiz</h1>
                <p class="text-xs text-indigo-400 font-medium">Pocket CFO for Entrepreneurs</p>
            </div>
        </div>

        <div id="clerk-sign-in" class="w-full flex justify-center"></div>
    </div>

    <!-- Clerk JS SDK via jsDelivr CDN -->
    <script
      async crossorigin="anonymous"
      data-clerk-publishable-key="{{ clerk_publishable_key or 'pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA' }}"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      onload="window.Clerk.load().then(() => {
        const clerk = window.Clerk;
        if (clerk.user) {
          window.location.href = '/';
        } else {
          clerk.mountSignIn(document.getElementById('clerk-sign-in'));
        }
      })">
    </script>
</body>
</html>
