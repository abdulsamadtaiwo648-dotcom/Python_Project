<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SoloBiz</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Scope Clerk component to match our dark theme */
    #clerk-sign-in .cl-rootBox { width: 100%; }
    #clerk-sign-in .cl-card { background: transparent; box-shadow: none; padding: 0; }
  </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">

    <!-- Header -->
    <div class="flex flex-col items-center mb-6 text-center">
      <img src="/static/logo.svg" alt="SoloBiz Logo" class="w-12 h-12 rounded-xl shadow-lg border border-indigo-500/20 mb-3">
      <h1 class="text-2xl font-bold">Welcome Back</h1>
      <p class="text-xs text-slate-400 mt-1">Log in to your SoloBiz account</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg text-xs font-medium text-center animate-pulse">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- ① Manual Email + Password Form -->
    <form id="manual-login-form" action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email Address</label>
        <input type="email" id="login-email" name="email" required placeholder="name@example.com"
               class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm transition">
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-300 uppercase">Password</label>
          <button type="button" id="forgot-btn" class="text-xs text-indigo-400 hover:underline font-medium cursor-pointer">
            Forgot Password?
          </button>
        </div>
        <input type="password" name="password" required placeholder="••••••••"
               class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm transition">
      </div>
      <button type="submit"
              class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm cursor-pointer">
        Log In with Email
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6 text-center">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-700"></div>
      </div>
      <span class="relative bg-slate-900 px-3 text-xs text-slate-500 uppercase font-medium tracking-wider">Or sign in with</span>
    </div>

    <!-- ② Clerk Component Container -->
    <div id="clerk-sign-in" class="min-h-[48px]">
      <!-- Skeleton loader shown until Clerk mounts -->
      <div id="clerk-skeleton" class="w-full h-12 bg-slate-800 rounded-lg animate-pulse flex items-center justify-center">
        <span class="text-slate-500 text-xs">Loading Clerk…</span>
      </div>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">
      Don't have an account?
      <a href="/register" class="text-indigo-400 font-bold hover:underline">Sign up free</a>
    </p>
  </div>

  <!-- ─── Clerk SDK ─── -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>

  <script>
    const CLERK_PK = "pk_test_aW5ub2NlbnQtb2NlbG90LTk4MzUuY2xlcmsuYWNjb3VudHMuZGV2JA";

    // ─── Sync Clerk session into Flask ───────────────────────────────────────
    async function syncClerkSession() {
      try {
        const token = await window.Clerk.session.getToken();
        if (!token) return false;

        const res = await fetch("/clerk-sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        return data.status === "ok";
      } catch (err) {
        console.error("clerk-sync failed:", err);
        return false;
      }
    }

    // ─── Auto-mount Clerk SignIn on page load ─────────────────────────────────
    window.addEventListener("load", async function () {
      const container = document.getElementById("clerk-sign-in");
      const skeleton  = document.getElementById("clerk-skeleton");

      // Wait up to 5 s for the async Clerk script to initialise
      let attempts = 0;
      while (!window.Clerk && attempts < 50) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }

      if (!window.Clerk) {
        skeleton.innerHTML = '<p class="text-xs text-slate-500 text-center py-3">Clerk is unavailable. Please use the email form above.</p>';
        return;
      }

      try {
        await window.Clerk.load({ publishableKey: CLERK_PK });

        // If user is already signed in via Clerk, sync to Flask then go to dashboard
        if (window.Clerk.user) {
          const ok = await syncClerkSession();
          if (ok) { window.location.href = "/"; return; }
        }

        // Remove skeleton, mount the Clerk SignIn component
        skeleton.remove();
        window.Clerk.mountSignIn(container, {
          afterSignInUrl: "__clerk_sync__",   // we handle redirect ourselves
          signUpUrl: "/register"
        });

        // Listen for sign-in completion
        window.Clerk.addListener(async ({ session }) => {
          if (session) {
            const ok = await syncClerkSession();
            if (ok) window.location.href = "/";
          }
        });

      } catch (err) {
        console.error("Clerk load error:", err);
        skeleton.innerHTML = '<p class="text-xs text-slate-500 text-center py-3">Could not load Clerk. Please use the email form above.</p>';
      }
    });

    // ─── Forgot Password (Clerk email code flow) ──────────────────────────────
    document.getElementById("forgot-btn").addEventListener("click", async function () {
      const emailInput = document.getElementById("login-email");
      const email = emailInput ? emailInput.value.trim() : "";
      if (!email) {
        alert("Please type your email address in the Email field first.");
        return;
      }
      if (!window.Clerk) {
        alert("Clerk SDK is not ready. Please refresh and try again.");
        return;
      }
      try {
        await window.Clerk.load({ publishableKey: CLERK_PK });

        await window.Clerk.client.signIn.create({
          strategy: "reset_password_email_code",
          identifier: email,
        });

        const pin = prompt(`A 6-digit PIN was sent to ${email}.\n\nEnter the PIN:`);
        if (!pin) return;

        const newPassword = prompt("Enter your new password:");
        if (!newPassword) return;

        const result = await window.Clerk.client.signIn.attemptFirstFactor({
          strategy: "reset_password_email_code",
          code: pin.trim(),
          password: newPassword.trim(),
        });

        if (result.status === "complete") {
          const ok = await syncClerkSession();
          alert("Password updated! Logging you in…");
          if (ok) window.location.href = "/";
        } else {
          alert("Reset status: " + result.status);
        }
      } catch (err) {
        const msg = (err.errors && err.errors[0]) ? err.errors[0].message : (err.message || String(err));
        alert("Error: " + msg);
      }
    });
  </script>

</body>
</html>
