<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SoloBiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-sm">
        <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Create Account</h2>
        
        <form method="POST" action="/register" class="space-y-4">
            
            <!-- Flask Flash Messages Error Box -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm font-medium">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Email</label>
                <input type="email" name="email" placeholder="Email Address" required 
                    class="w-full border border-gray-200 rounded-lg p-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Password</label>
                <input type="password" name="password" placeholder="Create a Password" required 
                    class="w-full border border-gray-200 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            
            <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-lg shadow-md hover:bg-gray-800">
                Sign Up
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account? <a href="/login" class="text-indigo-600 font-bold">Log in</a>
        </p>
    </div>
</body>
</html>
